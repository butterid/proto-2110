<style>
:root{--bg:#f6f3eb;--paper:#fffdf7;--ink:#1d2a22;--mute:#58655c;--line:#dcd5c5;--sea:#245a75;color-scheme:light}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:grid;place-items:center;background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,"Segoe UI",sans-serif;padding:max(18px,env(safe-area-inset-left,0px))}
form{width:min(380px,100%);background:var(--paper);border:1px solid var(--line);border-radius:16px;padding:26px 22px}

p{color:var(--mute);margin:0 0 18px;font-size:15px;line-height:1.5}
label{display:block;font-weight:700;font-size:14px;margin-bottom:6px}
input{width:100%;font:inherit;font-size:17px;padding:12px 14px;border:1.5px solid var(--line);border-radius:10px}
button{margin-top:14px;width:100%;font:inherit;font-weight:700;font-size:17px;padding:13px;border:0;border-radius:999px;background:var(--sea);color:#fff;cursor:pointer}
.err{color:#a3331b;font-size:14px;margin:10px 0 0;min-height:1.2em}
</style>
</head>

</form>

const b64 = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
async function unlock(pw) {
  const base = await crypto.subtle.importKey('raw', new TextEncoder().encode(pw), 'PBKDF2', false, ['deriveBits']);
  const bits = await crypto.subtle.deriveBits({ name: 'PBKDF2', salt: b64(SALT), iterations: ITER, hash: 'SHA-256' }, base, 256);
  const key = await crypto.subtle.importKey('raw', bits, 'AES-GCM', false, ['decrypt']);
  const ct = b64(CT);
  const plain = await crypto.subtle.decrypt({ name: 'AES-GCM', iv: ct.slice(0, 12) }, key, ct.slice(12));
  try { sessionStorage.setItem('muxk', btoa(String.fromCharCode(...new Uint8Array(bits)))) } catch (e) {}
  window.__MUXKEY = key;
  const html = new TextDecoder().decode(plain);
  document.open(); document.write(html); document.close();
}
